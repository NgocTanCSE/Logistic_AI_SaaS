apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartlogi-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          {{- range $name, $config := .Values.components }}
          - path: /api/v1/{{ $name }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $config.port }}
          {{- end }}
