services:
  # --- Infrastructure ---
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-smartlogi}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - smartlogi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d smartlogi"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"

  redis:
    image: redis:7-alpine
    networks:
      - smartlogi-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - smartlogi-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - smartlogi-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - smartlogi-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # --- Database Migrator ---
  db-migrator:
    build:
      context: .
      dockerfile: packages/prisma-schemas/Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-smartlogi}
      - SEED_ON_START=false
    command: >
      sh -c "pnpm exec prisma db push && if [ \"$$SEED_ON_START\" = \"true\" ]; then pnpm exec prisma db seed; else echo 'Skip seed'; fi"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - smartlogi-net

  # --- AI Engine ---
  ai-service:
    build: ./services/ai-service
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-smartlogi}
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    networks:
      - smartlogi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

  # --- Core Backends ---
  iam-service:
    build:
      context: .
      dockerfile: services/iam-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-smartlogi}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - PORT=8081
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    networks:
      - smartlogi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-smartlogi}
      - PORT=8082
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    networks:
      - smartlogi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-smartlogi}
      - PORT=8083
      - KAFKA_BROKERS=kafka:29092
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    networks:
      - smartlogi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  logistics-service:
    build:
      context: .
      dockerfile: services/logistics-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-smartlogi}
      - PORT=8084
      - AI_SERVICE_URL=http://ai-service:8000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
      ai-service:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - smartlogi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  customer-api:
    build:
      context: .
      dockerfile: services/customer-api/Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-smartlogi}
      - PORT=8085
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    networks:
      - smartlogi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-smartlogi}
      - KAFKA_BROKERS=kafka:29092
      - PORT=8086
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - EMAIL_PROVIDER=console
      - SMS_PROVIDER=console
      - PUSH_PROVIDER=console
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    networks:
      - smartlogi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  gps-ingestion-service:
    build:
      context: ./services/gps-ingestion-service
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-smartlogi}
      - GPS_AUTH_TOKEN=${GPS_AUTH_TOKEN}
    ports:
      - "8090:8090"
      - "8091:8091/udp"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    networks:
      - smartlogi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  webhook-service:
    build:
      context: ./services/webhook-service
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-smartlogi}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=8092
      - WEBHOOK_AUTH_TOKEN=${WEBHOOK_AUTH_TOKEN}
    networks:
      - smartlogi-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # --- API Gateway ---
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - IAM_SERVICE_URL=http://iam-service:8081
      - INVENTORY_SERVICE_URL=http://inventory-service:8082
      - ORDER_SERVICE_URL=http://order-service:8083
      - LOGISTICS_SERVICE_URL=http://logistics-service:8084
      - CUSTOMER_API_URL=http://customer-api:8085
      - NOTIFICATION_SERVICE_URL=http://notification-service:8086
      - AI_SERVICE_URL=http://ai-service:8000
      - GPS_INGESTION_URL=http://gps-ingestion-service:8090
      - WEBHOOK_SERVICE_URL=http://webhook-service:8092
    depends_on:
      iam-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      logistics-service:
        condition: service_healthy
      customer-api:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - smartlogi-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # --- Frontends ---
  tenant-portal:
    build:
      context: .
      dockerfile: apps/tenant-portal/Dockerfile
    ports:
      - "4002:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api-gateway:3000/api/v1
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - smartlogi-net

  admin-portal:
    build:
      context: .
      dockerfile: apps/admin-portal/Dockerfile
    ports:
      - "4001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api-gateway:3000/api/v1
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - smartlogi-net

  customer-portal:
    build:
      context: .
      dockerfile: apps/customer-portal/Dockerfile
    ports:
      - "4003:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api-gateway:3000/api/v1
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - smartlogi-net

  pack-station-web:
    build:
      context: .
      dockerfile: apps/pack-station-web/Dockerfile
    ports:
      - "4004:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api-gateway:3000/api/v1
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - smartlogi-net

networks:
  smartlogi-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
