# Each frontend is served as its own site (own host) instead of a numbered port.
# Add the matching hosts to Google OAuth "Authorized JavaScript origins":
#   http://admin.localhost:8080
#   http://tenant.localhost:8080
#   http://customer.localhost:8080
#   http://pack.localhost:8080
#
# *.localhost resolves to 127.0.0.1 automatically in modern browsers, so no
# /etc/hosts entry is required for local development.

resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name admin.localhost;

  location / {
    set $upstream http://admin-portal:3000;
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

