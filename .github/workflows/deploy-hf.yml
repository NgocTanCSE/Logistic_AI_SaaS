name: Deploy to Hugging Face

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@9.0.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter shared-types build
          pnpm --filter wms-engine build
          pnpm --filter ui-components build

      - name: Build services
        run: |
          pnpm --filter api-gateway run build
          pnpm --filter iam-service run build
          pnpm --filter inventory-service run build
          pnpm --filter logistics-service run build
          pnpm --filter order-service run build
          pnpm --filter customer-api run build
          pnpm --filter notification-service run build

      - name: Build frontend
        run: |
          pnpm --filter admin-portal run build
          pnpm --filter tenant-portal run build
          pnpm --filter customer-portal run build

      - name: Deploy to Hugging Face
        uses: huggingface/huggingface-hub-action@v2
        with:
          repo_id: ${{ secrets.HF_REPO_ID }}
          token: ${{ secrets.HF_TOKEN }}
          path: .