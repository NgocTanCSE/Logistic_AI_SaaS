name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space (orphan branch)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_URL: https://user:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/tancse2005/Logistic_AI
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git checkout --orphan hf-deploy
          git rm -rf --cached . 2>/dev/null || true
          rm -rf apps/driver-app
          rm -rf packages/prisma-schemas/prisma/migrations
          rm -f .env.docker
          cp Dockerfile.hf Dockerfile
          git add -A
          git commit -m "Deploy to Hugging Face Space" || echo "No changes to commit"
          git push --force $HF_URL hf-deploy:main