global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'smartlogi-gateway'
    static_configs:
      - targets: ['api-gateway:8000']

  - job_name: 'smartlogi-iam-service'
    static_configs:
      - targets: ['iam-service:3000']
    metrics_path: '/metrics'

  - job_name: 'smartlogi-order-service'
    static_configs:
      - targets: ['order-service:3000']
    metrics_path: '/metrics'

  - job_name: 'smartlogi-logistics-service'
    static_configs:
      - targets: ['logistics-service:3000']
    metrics_path: '/metrics'

  - job_name: 'smartlogi-inventory-service'
    static_configs:
      - targets: ['inventory-service:3000']
    metrics_path: '/metrics'

  - job_name: 'smartlogi-customer-api'
    static_configs:
      - targets: ['customer-api:3000']
    metrics_path: '/metrics'

  - job_name: 'smartlogi-notification-service'
    static_configs:
      - targets: ['notification-service:3000']
    metrics_path: '/metrics'

  - job_name: 'smartlogi-ai-service'
    static_configs:
      - targets: ['ai-service:8000']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'smartlogi-gps-ingestion'
    static_configs:
      - targets: ['gps-ingestion-service:8090']
    metrics_path: '/metrics'

  - job_name: 'smartlogi-webhook-service'
    static_configs:
      - targets: ['webhook-service:8092']
    metrics_path: '/metrics'

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']
