<?xml version="1.0" encoding="UTF-8"?>
<!-- SmartLogi-SaaS architecture diagram (layered, multi-tenant) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 820"
     style="background:#0b101f" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <filter id="g">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="1180" height="64" rx="0" fill="#111826"/>
  <text x="36" y="40" fill="#e2e8f0" font-size="20" font-weight="600">SmartLogi-SaaS — Multi-Tenant Logistics Platform</text>
  <text x="1010" y="40" fill="#93c5fd" font-size="12" text-anchor="end">架构图</text>

  <!-- L1: Actors -->
  <g font-size="11" fill="#cbd5e8">
    <circle cx="130" cy="118" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="130" y="122" text-anchor="middle" font-size="9">🚛</text>
    <text x="130" y="148" text-anchor="middle">Driver (mobile app)</text>

    <circle cx="420" cy="118" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="420" y="122" text-anchor="middle" font-size="9">👤</text>
    <text x="420" y="148" text-anchor="middle">Customer</text>

    <circle cx="760" cy="118" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="760" y="122" text-anchor="middle" font-size="9">👤</text>
    <text x="760" y="148" text-anchor="middle">Tenant Admin / Warehouse Manager</text>
  </g>

  <!-- L2: Frontend -->
  <g font-size="11" fill="#cbd5e8">
    <rect x="60" y="180" width="200" height="58" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#g)"/>
    <rect x="60" y="180" width="200" height="24" rx="10" fill="#0ea5e9" fill-opacity="0.12"/>
    <text x="76" y="196" fill="#38bdf8" font-weight="600">tenant-portal</text>
    <text x="76" y="214" fill="#93c5fd">Next 15.2  ·  :3000</text>

    <rect x="290" y="180" width="180" height="58" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#g)"/>
    <rect x="290" y="180" width="180" height="24" rx="10" fill="#0ea5e9" fill-opacity="0.12"/>
    <text x="306" y="196" fill="#38bdf8" font-weight="600">admin-portal*</text>
    <text x="306" y="214" fill="#93c5fd">Next 15.2 (feature-test)</text>

    <rect x="500" y="180" width="200" height="58" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#g)"/>
    <rect x="500" y="180" width="200" height="24" rx="10" fill="#0ea5e9" fill-opacity="0.12"/>
    <text x="516" y="196" fill="#38bdf8" font-weight="600">customer-portal</text>
    <text x="516" y="214" fill="#93c5fd">Next 15.2  ·  :3000</text>

    <rect x="730" y="180" width="190" height="58" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#g)"/>
    <rect x="730" y="180" width="190" height="24" rx="10" fill="#0ea5e9" fill-opacity="0.12"/>
    <text x="755" y="196" fill="#38bdf8" font-weight="600">pack-station-web</text>
    <text x="755" y="214" fill="#93c5fd">Next 15.2 PWA  ·  :3000</text>
  </g>

  <!-- L3: API Gateway -->
  <g font-size="11" fill="#cbd5e8">
    <rect x="470" y="266" width="180" height="54" rx="10" fill="#111826" stroke="#f59e0b" stroke-width="1.5" filter="url(#g)"/>
    <rect x="470" y="266" width="180" height="22" rx="10" fill="#f59e0b" fill-opacity="0.12"/>
    <text x="482" y="282" fill="#f59e0b" font-weight="600">api-gateway</text>
    <text x="482" y="298" fill="#fcd34d">NestJS · JWT guard · rate-limit</text>
  </g>

  <!-- L4: Backend microservices -->
  <g font-size="11" fill="#cbd5e8">
    <!-- NestJS group -->
    <rect x="60" y="342" width="820" height="78" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" filter="url(#g)"/>
    <rect x="60" y="342" width="820" height="22" rx="10" fill="#60a5fa" fill-opacity="0.10"/>
    <text x="76" y="360" fill="#60a5fa" font-weight="600">NestJS microservices</text>
    <text x="76" y="376" fill="#93c5fd">iam · order · inventory · logistics · notification · customer-api · gps-ingestion</text>

    <!-- Go service -->
    <rect x="60" y="426" width="220" height="50" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="1.5" filter="url(#g)"/>
    <rect x="60" y="426" width="220" height="20" rx="10" fill="#4ade80" fill-opacity="0.12"/>
    <text x="76" y="443" fill="#4ade80" font-weight="600">webhook-service</text>
    <text x="76" y="458" fill="#86efac">Go · package main · HTTP sink</text>

    <!-- Python AI service -->
    <rect x="300" y="426" width="260" height="50" rx="10" fill="#1e293b" stroke="#facc15" stroke-width="1.5" filter="url(#g)"/>
    <rect x="300" y="426" width="260" height="20" rx="10" fill="#facc15" fill-opacity="0.12"/>
    <text x="316" y="443" fill="#facc15" font-weight="600">ai-service</text>
    <text x="316" y="458" fill="#fef08a">Python FastAPI · demand/anomaly/deliv-time models</text>

    <!-- Kafka note -->
    <rect x="820" y="342" width="180" height="78" rx="10" fill="#111826" stroke="#a78bfa" stroke-width="1.5" filter="url(#g)"/>
    <rect x="820" y="342" width="180" height="22" rx="10" fill="#a78bfa" fill-opacity="0.12"/>
    <text x="836" y="358" fill="#a78bfa" font-weight="600">event bus</text>
    <text x="836" y="374" fill="#c4b5f6">order.created</text>
    <text x="836" y="386" fill="#c4b5f6">trip.assigned</text>
    <text x="836" y="398" fill="#c4b5f6">push.sent</text>
  </g>

  <!-- Shared packages shelf -->
  <g font-size="10" fill="#94a3b8">
    <rect x="60" y="506" width="1060" height="46" rx="8" fill="#111826" stroke="#475569" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="60" y="506" width="1060" height="16" rx="8" fill="#38bdf8" fill-opacity="0.08"/>
    <text x="76" y="519" fill="#38bdf8" font-weight="600">SHARED PACKAGES (@internal / workspace)</text>
    <text x="76" y="534" fill="#94a3b8">shared-types · prisma-schemas · wms-engine · offline-sync-engine · ui-components · map-components · hardware-bridge · mobile-ui-kit</text>
  </g>

  <!-- L5: Data & Infra -->
  <g font-size="11" fill="#cbd5e8">
    <rect x="60" y="570" width="210" height="72" rx="10" fill="#1e293b" stroke="#f87171" stroke-width="1.5" filter="url(#g)"/>
    <rect x="60" y="570" width="210" height="20" rx="10" fill="#f87171" fill-opacity="0.12"/>
    <text x="76" y="586" fill="#f87171" font-weight="600">PostgreSQL 15 + PostGIS</text>
    <text x="76" y="602" fill="#fca5a5">multi-schema tenant isolation</text>
    <text x="76" y="616" fill="#fca5a5" font-size="10">schema: tenant_\&lt;id\&gt; via TenantMiddleware</text>
    <text x="76" y="626" fill="#fca5a5" font-size="10">X-Tenant-ID header</text>

    <rect x="290" y="570" width="180" height="72" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="1.5" filter="url(#g)"/>
    <rect x="290" y="570" width="180" height="20" rx="10" fill="#34d399" fill-opacity="0.12"/>
    <text x="306" y="586" fill="#34d399" font-weight="600">Redis</text>
    <text x="306" y="602" fill="#86efac">cache · sessions</text>

    <rect x="490" y="570" width="190" height="72" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5" filter="url(#g)"/>
    <rect x="490" y="570" width="190" height="20" rx="10" fill="#a78bfa" fill-opacity="0.12"/>
    <text x="506" y="586" fill="#a78bfa" font-weight="600">Kafka + Zookeeper</text>
    <text x="506" y="602" fill="#c4b5f6">event streaming</text>

    <rect x="700" y="570" width="180" height="72" rx="10" fill="#1e293b" stroke="#fb7185" stroke-width="1.5" filter="url(#g)"/>
    <rect x="700" y="570" width="180" height="20" rx="10" fill="#fb7185" fill-opacity="0.12"/>
    <text x="716" y="586" fill="#fb7185" font-weight="600">MinIO</text>
    <text x="716" y="602" fill="#fecdd3">S3 object storage</text>

    <rect x="900" y="570" width="220" height="72" rx="10" fill="#1e293b" stroke="#fb923c" stroke-width="1.5" filter="url(#g)"/>
    <rect x="900" y="570" width="220" height="20" rx="10" fill="#fb923c" fill-opacity="0.12"/>
    <text x="916" y="586" fill="#fb923c" font-weight="600">db-migrator</text>
    <text x="916" y="602" fill="#fecaca">Prisma migrate @ startup</text>
  </g>

  <!-- Arrows (simplified, clean paths) -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path fill="#38bdf8" d="M0,0 L9,3 L0,6 Z"/>
    </marker>
  </defs>
  <g stroke="#38bdf8" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M130 140 L130 178"/>
    <path d="M420 140 L420 178"/>
    <path d="M760 140 L760 178"/>
    <path d="M160 238 L160 266"/>
    <path d="M380 238 L380 266"/>
    <path d="M600 238 L600 266"/>
    <path d="M825 238 L825 266"/>
    <path d="M560 320 L560 342"/>
    <path d="M560 412 L560 426" stroke="#4ade80"/>
    <path d="M560 476 L560 506" stroke="#facc15"/>
    <!-- data arrows -->
    <path d="M165 642 L165 570" stroke="#f87171"/>
    <path d="M380 642 L380 570" stroke="#34d399"/>
    <path d="M585 642 L585 570" stroke="#a78bfa"/>
    <path d="M790 642 L790 570" stroke="#fb7185"/>
    <path d="M1010 642 L1010 570" stroke="#fb923c"/>
  </g>

  <!-- Legend -->
  <g font-size="10" fill="#64748b">
    <text x="60" y="800">* admin-portal nằm ở frontend/feature-test (đang phát triển)</text>
    <text x="60" y="786">Legend: 🔵 NestJS · 🟢 Go · 🟡 Python · 🔴 PostgreSQL · 🟣 Kafka · 🟢 Redis · 🩷 MinIO · 🧡 Migrator</text>
  </g>
</svg>
