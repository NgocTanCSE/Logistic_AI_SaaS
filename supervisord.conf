[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:iam-service]
command=node backend/iam-service/dist/main.js
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1
environment=DATABASE_URL="file:/app/packages/prisma-schemas/prisma/dev.db",JWT_SECRET="smartlogi-jwt-secret",KAFKA_BROKERS="",PORT=3001,GOOGLE_CLIENT_ID="",GOOGLE_CLIENT_SECRET="",GOOGLE_CALLBACK_URL="http://localhost:3001/api/v1/admin/auth/google/callback"

[program:inventory-service]
command=node backend/inventory-service/dist/main.js
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DATABASE_URL="file:/app/packages/prisma-schemas/prisma/dev.db",JWT_SECRET="smartlogi-jwt-secret",KAFKA_BROKERS="",PORT=3002

[program:order-service]
command=node backend/order-service/dist/main.js
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DATABASE_URL="file:/app/packages/prisma-schemas/prisma/dev.db",JWT_SECRET="smartlogi-jwt-secret",KAFKA_BROKERS="",PORT=3003

[program:logistics-service]
command=node backend/logistics-service/dist/main.js
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DATABASE_URL="file:/app/packages/prisma-schemas/prisma/dev.db",JWT_SECRET="smartlogi-jwt-secret",KAFKA_BROKERS="",PORT=3004

[program:notification-service]
command=node backend/notification-service/dist/main.js
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DATABASE_URL="file:/app/packages/prisma-schemas/prisma/dev.db",JWT_SECRET="smartlogi-jwt-secret",KAFKA_BROKERS="",PORT=3006

[program:customer-api]
command=node backend/customer-api/dist/main.js
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DATABASE_URL="file:/app/packages/prisma-schemas/prisma/dev.db",JWT_SECRET="smartlogi-jwt-secret",PORT=3005

[program:api-gateway]
command=node api/api-gateway/dist/main.js
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=DATABASE_URL="file:/app/packages/prisma-schemas/prisma/dev.db",JWT_SECRET="smartlogi-jwt-secret",PORT="%(ENV_PORT)s",AI_API_KEY="smartlogi-ai-key",IAM_SERVICE_URL="http://localhost:3001",INVENTORY_SERVICE_URL="http://localhost:3002",ORDER_SERVICE_URL="http://localhost:3003",LOGISTICS_SERVICE_URL="http://localhost:3004",CUSTOMER_API_URL="http://localhost:3005",NOTIFICATION_SERVICE_URL="http://localhost:3006",GPS_INGESTION_URL="http://localhost:3008",WEBHOOK_SERVICE_URL="http://localhost:3009",AI_WORKER_URL="http://localhost:8787"

[program:ai-worker]
command=node_modules/.bin/wrangler dev --port 8787
directory=/app/workers/ai-worker
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:tenant-portal]
command=pnpm --filter tenant-portal run start -p 7860
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NEXT_PUBLIC_API_URL="http://localhost:3007/api/v1"

