[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:iam-service]
command=node services/iam-service/dist/main.js
directory=/app
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=1
environment=DATABASE_URL="file:/app/packages/prisma-schemas/prisma/dev.db",JWT_SECRET="smartlogi-jwt-secret",KAFKA_BROKERS="",PORT=3001

